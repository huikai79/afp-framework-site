name: AFP Benchmark v0.1

on:
  pull_request:
    paths:
      - 'benchmarks/afp-v0.1/**'
      - '.github/workflows/benchmark.yml'
  push:
    branches:
      - main
    paths:
      - 'benchmarks/afp-v0.1/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate = no API calls; live = generate raw model outputs'
        required: true
        default: validate
        type: choice
        options:
          - validate
          - live
      model:
        description: 'OpenAI model ID for live mode'
        required: false
        default: ''
        type: string
      repeats:
        description: '1 = smoke; 3 = variance run'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '3'
      reasoning:
        description: 'Reasoning effort for live mode'
        required: true
        default: none
        type: choice
        options:
          - default
          - none
          - low
          - medium
          - high
          - xhigh
          - max

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate benchmark pack
        run: python benchmarks/afp-v0.1/runner.py validate

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
    needs: validate
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require explicit model ID
        shell: bash
        run: |
          if [ -z "${{ inputs.model }}" ]; then
            echo "Live mode requires a non-empty model input." >&2
            exit 2
          fi

      - name: Require OPENAI_API_KEY secret
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured." >&2
            exit 2
          fi

      - name: Install pinned live dependency
        run: python -m pip install --disable-pip-version-check -r benchmarks/afp-v0.1/requirements-live.txt

      - name: Generate raw benchmark outputs
        run: >-
          python benchmarks/afp-v0.1/runner.py live
          --model "${{ inputs.model }}"
          --repeats "${{ inputs.repeats }}"
          --reasoning "${{ inputs.reasoning }}"

      - name: Upload raw outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afp-benchmark-v0.1-raw-${{ github.run_id }}
          path: benchmarks/afp-v0.1/results/*.jsonl
          if-no-files-found: warn
          retention-days: 30
