name: AFP Benchmark v0.1

on:
  pull_request:
    paths:
      - 'benchmarks/afp-v0.1/**'
      - '.github/workflows/benchmark.yml'
  push:
    branches:
      - main
    paths:
      - 'benchmarks/afp-v0.1/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate = no API calls; live = generate raw model outputs'
        required: true
        default: validate
        type: choice
        options:
          - validate
          - live
      confirm_external_costs:
        description: 'I understand live mode may create billable OpenAI usage'
        required: true
        default: false
        type: boolean
      scope:
        description: 'smoke = 1 case; full = complete A/B/C/D benchmark matrix'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
      fixture_id:
        description: 'Fixture used when scope=smoke'
        required: true
        default: P01
        type: choice
        options:
          - P01
          - P02
          - P03
          - P04
          - P05
          - P06
          - P07
          - P08
      treatment:
        description: 'Treatment used when scope=smoke'
        required: true
        default: A
        type: choice
        options:
          - A
          - B
          - C
          - D
      model:
        description: 'OpenAI model ID for live mode'
        required: false
        default: ''
        type: string
      repeats:
        description: '1 = smoke; 3 = variance run'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '3'
      reasoning:
        description: 'Reasoning effort for live mode'
        required: true
        default: none
        type: choice
        options:
          - default
          - none
          - low
          - medium
          - high
          - xhigh
          - max

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate benchmark pack
        run: python benchmarks/afp-v0.1/runner.py validate

      - name: Run benchmark runner unit tests
        run: python -m unittest discover -s benchmarks/afp-v0.1/tests -p "test_*.py" -v

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live' && inputs.confirm_external_costs == true
    needs: validate
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Require explicit model ID
        shell: bash
        run: |
          if [ -z "${{ inputs.model }}" ]; then
            echo "Live mode requires a non-empty model input." >&2
            exit 2
          fi

      - name: Require OPENAI_API_KEY secret
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured." >&2
            exit 2
          fi

      - name: Install pinned live dependency
        run: python -m pip install --disable-pip-version-check -r benchmarks/afp-v0.1/requirements-live.txt

      - name: Generate raw benchmark outputs
        shell: bash
        run: |
          set -euo pipefail

          args=(
            python benchmarks/afp-v0.1/runner.py live
            --model "${{ inputs.model }}"
            --repeats "${{ inputs.repeats }}"
            --reasoning "${{ inputs.reasoning }}"
          )

          if [ "${{ inputs.scope }}" = "smoke" ]; then
            args+=(
              --fixture-id "${{ inputs.fixture_id }}"
              --treatment "${{ inputs.treatment }}"
            )
          fi

          "${args[@]}"

      - name: Verify run bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find benchmarks/afp-v0.1/results -maxdepth 1 -name '*.manifest.json' -print -quit)"
          if [ -z "$manifest" ]; then
            echo "No run manifest was generated." >&2
            exit 3
          fi
          python benchmarks/afp-v0.1/runner.py verify-run "$manifest"

      - name: Verify requested live scope
        if: inputs.scope == 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find benchmarks/afp-v0.1/results -maxdepth 1 -name '*.manifest.json' -print -quit)"
          python - "$manifest" <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert manifest["expected_record_count"] == 1, manifest
          assert manifest["actual_record_count"] == 1, manifest
          assert manifest["scoring"]["status"] == "UNSCORED", manifest
          print("AFP one-case live smoke scope: PASS")
          PY

      - name: Upload raw outputs and run manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: afp-benchmark-v0.1-run-${{ github.run_id }}
          path: |
            benchmarks/afp-v0.1/results/*.jsonl
            benchmarks/afp-v0.1/results/*.manifest.json
          if-no-files-found: warn
          retention-days: 30
