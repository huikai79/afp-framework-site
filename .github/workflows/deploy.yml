name: Deploy website to GitHub Pages

env:
  WC_HUGO_VERSION: '0.148.2'
  NODE_VERSION: '24'
  PRODUCTION_URL: 'https://afpframework.org/'

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install pinned frontend dependencies
        run: pnpm install

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true

      - uses: actions/cache@v4
        with:
          path: |
            /tmp/hugo_cache_runner/
            node_modules/
            modules/*/node_modules/
          key: ${{ runner.os }}-hugo-deps-${{ hashFiles('**/go.mod', '**/package.json', '**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-deps-

      - uses: actions/cache@v4
        with:
          path: resources/
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('assets/**/*', 'config/**/*', 'hugo.yaml', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_MINIFY_TDEWOLFF_HTML_KEEPCOMMENTS: 'true'
          HUGO_ENABLEMISSINGTRANSLATIONPLACEHOLDERS: 'true'
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Audit Hugo output for latent render failures
        shell: bash
        run: |
          set -euo pipefail
          pattern='<!-- raw HTML omitted -->|ZgotmplZ|\[i18n\]|\(<nil>\)|(&lt;nil&gt;)|hahahugo'
          if grep -inorE "$pattern" public/; then
            echo 'Hugo site audit found a latent render failure marker.' >&2
            exit 1
          fi

      - name: Generate Pagefind search index
        run: pnpm run search:index

      - name: Validate generated site
        run: python scripts/site_quality_check.py public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    if: github.repository_owner != 'HugoBlox'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  production-acceptance:
    if: github.repository_owner != 'HugoBlox'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4

      - name: Verify canonical production site over HTTP
        run: python scripts/production_acceptance.py "${{ env.PRODUCTION_URL }}"

      - name: Report GitHub Pages deployment URL
        run: echo "GitHub Pages deployment URL: ${{ needs.deploy.outputs.page_url }}"
