name: Site quality

on:
  pull_request:
  push:
    branches:
      - 'audit/**'
      - 'feature/**'

permissions:
  contents: read

env:
  WC_HUGO_VERSION: '0.148.2'
  NODE_VERSION: '20'

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install pinned frontend dependencies
        run: pnpm install

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true

      - name: Build production site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --baseURL 'https://afpframework.org/'

      - name: Generate Pagefind index
        run: pnpm run search:index

      - name: Run generated-site checks
        run: python scripts/site_quality_check.py public
